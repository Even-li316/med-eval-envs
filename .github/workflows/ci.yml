name: eval

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install numpy
      - name: baselines with replay check
        run: python3 baselines/run_eval.py --replay
      - name: assert replay is identical
        run: python3 tools/check_replay.py
